plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def configValue = { String key ->
    def value = project.findProperty(key)
    if (value != null) {
        return value.toString()
    }
    return localProperties.getProperty(key, "")
}

def quotedBuildConfig = { String value ->
    return "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

android {
    namespace "com.agenttmux.web"
    compileSdk 35

    defaultConfig {
        applicationId "com.agenttmux.web"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.1.1"

        buildConfigField "String", "DEFAULT_SERVER_URL", quotedBuildConfig(configValue("agentTmuxDefaultUrl"))
        buildConfigField "String", "DEFAULT_AUTH_TOKEN", quotedBuildConfig(configValue("agentTmuxDefaultToken"))
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
}
