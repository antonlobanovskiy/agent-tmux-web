plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def configValue = { String key ->
    def value = project.findProperty(key)
    if (value != null) {
        return value.toString()
    }
    return localProperties.getProperty(key, "")
}

def quotedBuildConfig = { String value ->
    return "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

def applicationIdSuffixValue = configValue("agentTmuxApplicationIdSuffix").trim()
def normalizedApplicationIdSuffix = applicationIdSuffixValue
    ? (applicationIdSuffixValue.startsWith(".") ? applicationIdSuffixValue : "." + applicationIdSuffixValue)
    : ""
def appLabel = configValue("agentTmuxAppLabel").trim() ?: "Agent Tmux"
def configuredVersionCode = configValue("agentTmuxVersionCode").trim()
def configuredVersionName = configValue("agentTmuxVersionName").trim()
def releaseStoreFile = configValue("agentTmuxReleaseStoreFile").trim()
def releaseStorePassword = configValue("agentTmuxReleaseStorePassword").trim()
def releaseKeyAlias = configValue("agentTmuxReleaseKeyAlias").trim()
def releaseKeyPassword = configValue("agentTmuxReleaseKeyPassword").trim()
def hasReleaseSigning = releaseStoreFile || releaseStorePassword || releaseKeyAlias || releaseKeyPassword
if (hasReleaseSigning && !(releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword)) {
    throw new GradleException("Set agentTmuxReleaseStoreFile, agentTmuxReleaseStorePassword, agentTmuxReleaseKeyAlias, and agentTmuxReleaseKeyPassword together.")
}

def playSigningRequested = configValue("agentTmuxPlaySigning").trim().equalsIgnoreCase("true")
def playStoreFile = configValue("agentTmuxPlayStoreFile").trim()
def playStorePassword = configValue("agentTmuxPlayStorePassword").trim()
def playKeyAlias = configValue("agentTmuxPlayKeyAlias").trim()
def playKeyPassword = configValue("agentTmuxPlayKeyPassword").trim()
def hasAnyPlaySigning = playStoreFile || playStorePassword || playKeyAlias || playKeyPassword
def hasPlaySigning = playStoreFile && playStorePassword && playKeyAlias && playKeyPassword

android {
    namespace "com.agenttmux.web"
    compileSdk 36

    signingConfigs {
        localRelease {
            if (hasReleaseSigning) {
                def storePath = new File(releaseStoreFile)
                storeFile storePath.isAbsolute() ? storePath : rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        playUpload {
            if (hasPlaySigning) {
                def storePath = new File(playStoreFile)
                storeFile storePath.isAbsolute() ? storePath : rootProject.file(playStoreFile)
                storePassword playStorePassword
                keyAlias playKeyAlias
                keyPassword playKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.agenttmux.web${normalizedApplicationIdSuffix}"
        minSdk 26
        targetSdk 36
        versionCode configuredVersionCode ? configuredVersionCode.toInteger() : 25
        versionName configuredVersionName ?: "0.1.24"
        manifestPlaceholders = [agentTmuxAppLabel: appLabel]

        buildConfigField "String", "DEFAULT_SERVER_URL", quotedBuildConfig(configValue("agentTmuxDefaultUrl"))
        buildConfigField "String", "DEFAULT_AUTH_TOKEN", quotedBuildConfig(configValue("agentTmuxDefaultToken"))
        buildConfigField "String", "PRIVACY_POLICY_URL", quotedBuildConfig("https://github.com/antonlobanovskiy/agent-tmux-web/blob/main/PRIVACY.md")
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig playSigningRequested
                ? signingConfigs.playUpload
                : (hasReleaseSigning ? signingConfigs.localRelease : signingConfigs.debug)
            minifyEnabled false
            debuggable false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "agent-tmux-web-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

if (hasAnyPlaySigning && !hasPlaySigning) {
    throw new GradleException("Set agentTmuxPlayStoreFile, agentTmuxPlayStorePassword, agentTmuxPlayKeyAlias, and agentTmuxPlayKeyPassword together.")
}
if (playSigningRequested && !hasPlaySigning) {
    throw new GradleException("Google Play builds require a dedicated upload key. Configure the agentTmuxPlay* signing properties described in android/README.md.")
}
if (playSigningRequested && new File(playStoreFile).name.equalsIgnoreCase("debug.keystore")) {
    throw new GradleException("Google Play builds cannot use Android's debug.keystore.")
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
